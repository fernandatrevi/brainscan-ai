name: ML baseline checks

on:
  push:
    paths:
      - 'ml/**'
      - 'tests/**'
      - '.github/workflows/ml-checks.yml'
  pull_request:
    paths:
      - 'ml/**'
      - 'tests/**'
      - '.github/workflows/ml-checks.yml'

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Check syntax
        run: python -m compileall -q ml tests
      - name: Run split integrity tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
