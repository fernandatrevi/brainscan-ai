name: Train MRI baseline models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt kagglehub

      - name: Download public MRI images and prepare training split
        run: python ml/prepare_kaggle.py --output-dir dataset

      - name: Train and evaluate SVM and Random Forest
        run: python ml/train.py --data-dir dataset --output-dir ml/artifacts

      - name: Upload metrics report (no patient images or models)
        uses: actions/upload-artifact@v4
        with:
          name: brainscan-baseline-metrics
          path: ml/artifacts/metrics.json
          if-no-files-found: error
          retention-days: 14
